name: Build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AutoClickerPro-win-x64.exe
            path: dist/AutoClickerPro-win-x64.exe
          - os: ubuntu-latest
            artifact: AutoClickerPro-linux-x86_64
            path: |
              dist/AutoClickerPro-linux-x86_64
              dist/AutoClickerPro-linux-x86_64.deb
              dist/AutoClickerPro-linux-x86_64.rpm
          - os: macos-latest
            artifact: AutoClickerPro-macos.app.zip
            path: AutoClickerPro-macos.app.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build macOS icon (icns)
        if: runner.os == 'macOS'
        run: |
          mkdir AppIcon.iconset
          sips -z 16 16 icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32 icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32 icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64 icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256 icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256 icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512 icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512 icon.png --out AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AutoClickerPro-win-x64 --icon icon.ico autoclicker.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m PyInstaller --noconfirm --clean --onefile --windowed --name AutoClickerPro-linux-x86_64 --collect-all pynput --collect-all Xlib autoclicker.py

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          PKG=autoclickerpro_1.1.0_amd64
          mkdir -p $PKG/DEBIAN $PKG/usr/bin $PKG/usr/share/applications $PKG/usr/share/icons/hicolor/256x256/apps
          cp dist/AutoClickerPro-linux-x86_64 $PKG/usr/bin/autoclicker-pro
          chmod +x $PKG/usr/bin/autoclicker-pro
          cp icon.png $PKG/usr/share/icons/hicolor/256x256/apps/autoclicker-pro.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Автокликер Pro' 'Name[ru]=Автокликер Pro' 'Comment=Неоновый автокликер' 'Exec=/usr/bin/autoclicker-pro' 'Icon=autoclicker-pro' 'Terminal=false' 'Categories=Utility;Accessibility;' > $PKG/usr/share/applications/autoclicker-pro.desktop
          printf '%s\n' 'Package: autoclicker-pro' 'Version: 1.1.0' 'Section: utils' 'Priority: optional' 'Architecture: amd64' 'Maintainer: fifasalam50-tech' 'Description: Неоновый автокликер для Windows, Linux и macOS' 'Depends: libx11-6, libxext6, libxkbcommon0' > $PKG/DEBIAN/control
          dpkg-deb --build --root-owner-group $PKG dist/AutoClickerPro-linux-x86_64.deb

      - name: Package .rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get install -y rpm
          mkdir -p $HOME/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          printf '%s\n' 'Name: autoclicker-pro' 'Version: 1.1.0' 'Release: 1' 'Summary: Неоновый автокликер для Windows, Linux и macOS' 'License: MIT' 'BuildArch: x86_64' '' '%description' 'Неоновый автокликер с интервалом, случайной задержкой и горячей клавишей.' '' '%prep' '' '%build' '' '%install' 'install -Dm755 %{_sourcedir}/AutoClickerPro-linux-x86_64 %{buildroot}%{_bindir}/autoclicker-pro' 'install -Dm644 %{_sourcedir}/icon.png %{buildroot}%{_datadir}/icons/hicolor/256x256/apps/autoclicker-pro.png' '' '%files' '%{_bindir}/autoclicker-pro' '%{_datadir}/icons/hicolor/256x256/apps/autoclicker-pro.png' > $HOME/rpmbuild/SPECS/autoclicker-pro.spec
          cp dist/AutoClickerPro-linux-x86_64 $HOME/rpmbuild/SOURCES/
          cp icon.png $HOME/rpmbuild/SOURCES/
          rpmbuild -bb $HOME/rpmbuild/SPECS/autoclicker-pro.spec
          cp $HOME/rpmbuild/RPMS/x86_64/*.rpm dist/AutoClickerPro-linux-x86_64.rpm

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: python -m PyInstaller --noconfirm --clean --windowed --name AutoClickerPro --icon AppIcon.icns --collect-all pynput autoclicker.py

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../AutoClickerPro-macos.app.zip AutoClickerPro.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AutoClickerPro-win-x64.exe/AutoClickerPro-win-x64.exe
            artifacts/AutoClickerPro-linux-x86_64/AutoClickerPro-linux-x86_64
            artifacts/AutoClickerPro-linux-x86_64/AutoClickerPro-linux-x86_64.deb
            artifacts/AutoClickerPro-linux-x86_64/AutoClickerPro-linux-x86_64.rpm
            artifacts/AutoClickerPro-macos.app.zip/AutoClickerPro-macos.app.zip
